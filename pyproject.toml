[project]
name = "OnlineTutor"
version = "0.1.0"
description = "Платформа"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "fastapi>=0.140.0",
    "pydantic-settings>=2.14.2",
    "sqlalchemy>=2.0.51",
    "uuid7>=0.1.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pydantic[dotenv]>=2.13.4",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
    "uvicorn>=0.51.0",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    "docs",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "C4",   # comprehensions
    "RET",  # return consistency
    "RUF",  # Ruff-specific rules
    "N",    # naming
]
fixable = ["ALL"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*.py"]
python_functions = ["test_*"]
