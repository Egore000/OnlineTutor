version: "3"

services:
  app:
    image: tutor-app
    build:
      context: .
    container_name: ${PROJECTNAME}_app
    env_file:
      - .env
    # command: sh -c "alembic upgrade head && uvicorn app.main:app --host=0.0.0.0 --port 8000"
    ports:
      - 8888:8000
    volumes:
      - .:/usr/src/app

