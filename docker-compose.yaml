version: "3"

x-building: &building
  build:
    context: .
    dockerfile: Dockerfile

# Общие параметры для нескольких сервисов
x-shared-parameters: &shared-parameters
  env_file:
    - .env
  restart: always

services:
  app:
    image: ${PROJECTNAME}-app
    <<: [*building, *shared-parameters]
    container_name: ${PROJECTNAME}_app
    env_file:
      - .env
    # command: sh -c "alembic upgrade head && uvicorn app.main:app --host=0.0.0.0 --port 8000"
    ports:
      - "${API_PORT}:8000"
    volumes:
      - .:/usr/src/app
    depends_on:
      - db

  db:
    <<: *shared-parameters
    image: postgres:15
    container_name: ${PROJECTNAME}_db
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # pgadmin:
  #   <<: *shared-parameters
  #   image: dpage/pgadmin4:latest
  #   container_name: ${PROJECTNAME}_pgadmin
  #   ports:
  #     - "${PGADMIN_PORT}:80"
  #   volumes:
  #     - pgadmin_volume:/var/lib/pgadmin/
  #   depends_on:
  #     - db

volumes:
  postgres_data:
  # pgadmin_volume: